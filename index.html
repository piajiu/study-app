<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>资料分析斩</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#FF6B35,#E55A25);color:#fff;padding:20px;text-align:center}
.header h1{font-size:24px;font-weight:700}
.header p{font-size:14px;opacity:0.9;margin-top:4px}
.content{padding:20px;max-width:600px;margin:0 auto}
.mod-title{font-size:16px;font-weight:600;margin:20px 0 12px;color:#666}
.mod-title:first-child{margin-top:0}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;transition:transform 0.2s}
.card:active{transform:scale(0.98)}
.card h3{font-size:16px;margin-bottom:4px;color:#333}
.card p{font-size:13px;color:#888}
.card .badge{display:inline-block;background:#FF6B35;color:#fff;padding:2px 8px;border-radius:10px;font-size:12px;margin-left:8px}
.tip{background:#fff3e0;border-radius:12px;padding:16px;margin-top:20px;font-size:14px;color:#e65100}
.tip strong{display:block;margin-bottom:4px}
</style>
</head>
<body>
<div class="header">
  <h1>📚 资料分析斩</h1>
  <p>百词斩式记忆学习</p>
</div>
<div class="content">
  <div class="tip">
    <strong>💡 使用提示</strong>
    点击下方模块开始学习。每张卡片先看例题，再做练习。答错的题会自动复习。
  </div>
  <div class="mod-title">📖 学习模块</div>
  <div class="card" onclick="startModule(0)">
    <h3>🔢 百化分速查 <span class="badge">20张</span></h3>
    <p>50%=1/2、33.3%=1/3... 最常用的分数转换</p>
  </div>
  <div class="card" onclick="startModule(1)">
    <h3>📝 核心公式 <span class="badge">15张</span></h3>
    <p>基期量、增长率、间隔增长率... 公式推导演示</p>
  </div>
  <div class="card" onclick="startModule(2)">
    <h3>⚡ 速算技巧 <span class="badge">10张</span></h3>
    <p>截位直除、分数比较、化乘为加... 快速计算方法</p>
  </div>
  <div class="card" onclick="startModule(3)">
    <h3>💡 易错辨析 <span class="badge">10张</span></h3>
    <p>百分数vs百分点、增幅vs降幅... 常见陷阱识别</p>
  </div>
</div>
<script>
const STORAGE_KEY='ziliaozhan_data_v3';

// 55张卡片数据
const CARDS=[
  // 模块0: 百化分 20张
  {m:0,q:'50% = ?',a:'1/2',opts:['1/2','1/3','1/4','1/5'],exp:'50%就是一半，等于1/2'},
  {m:0,q:'33.3% ≈ ?',a:'1/3',opts:['1/2','1/3','1/4','1/5'],exp:'33.3%≈1/3，3个33.3%≈100%'},
  {m:0,q:'25% = ?',a:'1/4',opts:['1/2','1/3','1/4','1/5'],exp:'25%就是1/4，一个季度'},
  {m:0,q:'20% = ?',a:'1/5',opts:['1/2','1/5','1/4','1/3'],exp:'20%就是1/5，5个20%=100%'},
  {m:0,q:'16.7% ≈ ?',a:'1/6',opts:['1/4','1/5','1/6','1/7'],exp:'16.7%≈1/6'},
  {m:0,q:'14.3% ≈ ?',a:'1/7',opts:['1/5','1/6','1/7','1/8'],exp:'14.3%≈1/7，一周7天'},
  {m:0,q:'12.5% = ?',a:'1/8',opts:['1/6','1/7','1/8','1/9'],exp:'12.5%精确等于1/8'},
  {m:0,q:'11.1% ≈ ?',a:'1/9',opts:['1/8','1/9','1/10','1/11'],exp:'11.1%≈1/9'},
  {m:0,q:'10% = ?',a:'1/10',opts:['1/8','1/9','1/10','1/11'],exp:'10%就是1/10，最简单'},
  {m:0,q:'9.1% ≈ ?',a:'1/11',opts:['1/10','1/11','1/12','1/13'],exp:'9.1%≈1/11'},
  {m:0,q:'8.3% ≈ ?',a:'1/12',opts:['1/10','1/11','1/12','1/13'],exp:'8.3%≈1/12，一年12个月'},
  {m:0,q:'7.7% ≈ ?',a:'1/13',opts:['1/11','1/12','1/13','1/14'],exp:'7.7%≈1/13'},
  {m:0,q:'7.1% ≈ ?',a:'1/14',opts:['1/12','1/13','1/14','1/15'],exp:'7.1%≈1/14'},
  {m:0,q:'6.7% ≈ ?',a:'1/15',opts:['1/13','1/14','1/15','1/16'],exp:'6.7%≈1/15'},
  {m:0,q:'6.25% = ?',a:'1/16',opts:['1/14','1/15','1/16','1/17'],exp:'6.25%精确等于1/16'},
  {m:0,q:'5.9% ≈ ?',a:'1/17',opts:['1/15','1/16','1/17','1/18'],exp:'5.9%≈1/17'},
  {m:0,q:'5.6% ≈ ?',a:'1/18',opts:['1/16','1/17','1/18','1/19'],exp:'5.6%≈1/18'},
  {m:0,q:'5.3% ≈ ?',a:'1/19',opts:['1/17','1/18','1/19','1/20'],exp:'5.3%≈1/19'},
  {m:0,q:'4% = ?',a:'1/25',opts:['1/20','1/25','1/30','1/50'],exp:'4%精确等于1/25'},
  {m:0,q:'2% = ?',a:'1/50',opts:['1/25','1/40','1/50','1/100'],exp:'2%精确等于1/50'},
  // 模块1: 核心公式 15张
  {m:1,q:'基期量 = ?',a:'现期量÷(1+r)',opts:['现期量×(1+r)','现期量÷(1+r)','现期量×r','现期量-r'],exp:'已知现期和增长率，基期=现期÷(1+r)'},
  {m:1,q:'现期量 = ?',a:'基期量×(1+r)',opts:['基期量÷(1+r)','基期量×(1+r)','基期量×r','基期量+r'],exp:'已知基期和增长率，现期=基期×(1+r)'},
  {m:1,q:'增长率r = ?',a:'(现期-基期)÷基期',opts:['现期÷基期','(现期-基期)÷基期','基期÷现期','现期-基期'],exp:'增长率=(现期-基期)÷基期'},
  {m:1,q:'增长量 = ?',a:'现期量×r÷(1+r)',opts:['现期量×r','现期量÷r','现期量×r÷(1+r)','基期量×r'],exp:'增长量=现期×r÷(1+r)，可用百化分'},
  {m:1,q:'间隔增长率 = ?',a:'r1+r2+r1×r2',opts:['r1+r2','r1×r2','r1+r2+r1×r2','r1-r2'],exp:'间隔增长率=r1+r2+r1×r2'},
  {m:1,q:'乘积增长率：总额=单价×数量，则r总=?',a:'r单+r数+r单×r数',opts:['r单+r数','r单×r数','r单+r数+r单×r数','r单-r数'],exp:'乘积增长率=rA+rB+rA×rB'},
  {m:1,q:'两期比重升降：a>b则比重?（a分子增长率，b分母增长率）',a:'上升',opts:['上升','下降','不变','无法判断'],exp:'两期比重：a>b则上升，a<b则下降'},
  {m:1,q:'两期比重差值公式：',a:'(A/B)×(a-b)/(1+a)',opts:['(A/B)×(a-b)','(A/B)×(a-b)/(1+a)','A×(a-b)/B','(A/B)×a-b'],exp:'两期比重差=(A/B)×(a-b)/(1+a)'},
  {m:1,q:'平均数增长率公式：',a:'(a-b)/(1+b)',opts:['a-b','(a-b)/(1+b)','(b-a)/(1+a)','a/b-1'],exp:'平均数增长率=(a-b)/(1+b)'},
  {m:1,q:'拉动增长率 = ?',a:'部分增长量÷整体基期量',opts:['部分增长量÷整体现期','部分增长量÷整体基期量','整体增长量÷部分基期','整体÷部分'],exp:'拉动增长率=部分增长量÷整体基期量×100%'},
  {m:1,q:'增长贡献率 = ?',a:'部分增长量÷整体增长量',opts:['部分÷整体','部分增长量÷整体增长量','部分增长率÷整体增长率','整体增长量÷部分增长量'],exp:'增长贡献率=部分增长量÷整体增长量×100%'},
  {m:1,q:'基期比重 = ?',a:'(A/B)×(1+b)/(1+a)',opts:['A/B','(A/B)×(1+b)/(1+a)','A×(1+a)/B','A÷(B×(1+b))'],exp:'基期比重=(A/B)×(1+b)/(1+a)'},
  {m:1,q:'年均增长率比较：当年数相同，比较?',a:'末期/初期',opts:['总增长率','末期/初期','平均增长量','初期/末期'],exp:'年数相同时，直接比较末期/初期'},
  {m:1,q:'混合增长率：整体增长率介于?',a:'两部分增长率之间',opts:['两部分增长率之间','较大增长率','较小增长率','平均增长率'],exp:'混合增长率居中，介于两部分之间'},
  {m:1,q:'化除为乘：1/(1+r)≈?',a:'1-r',opts:['1+r','1-r','r','1+r²'],exp:'当r较小时，1/(1+r)≈1-r'},
  // 模块2: 速算技巧 10张
  {m:2,q:'截位直除一步除法：应截?',a:'分母',opts:['分子','分母','分子分母都截','都不截'],exp:'一步除法直截分母'},
  {m:2,q:'截位直除多步除法：应截?',a:'分子分母都截',opts:['只截分子','只截分母','分子分母都截','都不截'],exp:'多步除法分子分母都截，截完约分'},
  {m:2,q:'选项差距大时截几位?',a:'2位',opts:['1位','2位','3位','4位'],exp:'选项差距大截2位，差距小截3位'},
  {m:2,q:'分数比较：分子大分母小，则?',a:'分数大',opts:['分数大','分数小','无法判断','一样大'],exp:'分子快看分子，分母大看分母'},
  {m:2,q:'×1.5 = ?',a:'原数+一半',opts:['原数+1.5','原数+一半','原数×1.5+1','原数÷1.5'],exp:'×1.5=原数+原数的一半'},
  {m:2,q:'÷5 = ?',a:'×2，小数点左移',opts:['×5','×2左移','÷2','×0.5'],exp:'除以5等于乘以2，小数点左移一位'},
  {m:2,q:'分数拆分化1法：把分数拆成?',a:'1±小分数',opts:['2±大分数','1±小分数','3±分数','整数±分数'],exp:'化1法：拆成1±小分数'},
  {m:2,q:'判断超过10%：增长量>基期/?',a:'10',opts:['5','8','10','20'],exp:'超过10%→增长量>基期/10'},
  {m:2,q:'判断超过20%：增长量>基期/?',a:'5',opts:['2','4','5','10'],exp:'超过20%→增长量>基期/5'},
  {m:2,q:'判断超过50%：增长量>基期/?',a:'2',opts:['1','2','3','4'],exp:'超过50%→增长量>基期/2'},
  // 模块3: 易错辨析 10张
  {m:3,q:'百分点表示?',a:'百分数的变化',opts:['百分数','百分数的变化','倍数','绝对值'],exp:'百分点表示百分数的变化，用加减法'},
  {m:3,q:'增幅、降幅、变化幅度的区别：增幅带?比',a:'正负号',opts:['绝对值','正负号','大小','正数'],exp:'增幅带正负号，降幅取绝对值'},
  {m:3,q:'A比B增长2倍，则A是B的?',a:'3倍',opts:['2倍','3倍','1倍','无法判断'],exp:'增长倍数=倍数-1，所以是3倍'},
  {m:3,q:'翻2番等于原来的?',a:'4倍',opts:['2倍','4倍','8倍','16倍'],exp:'翻n番=2^n倍，翻2番=4倍'},
  {m:3,q:'同比是与?',a:'上年同期',opts:['上月','上年同期','上季度','上一天'],exp:'同比=与上年同期相比'},
  {m:3,q:'环比是与?',a:'相邻上一期',opts:['上年同期','相邻上一期','固定周期','去年同期'],exp:'环比=与紧紧相邻的上一统计周期相比'},
  {m:3,q:'名义增长率?实际增长率（物价上涨时）',a:'>',opts:['>','<','=','≤'],exp:'名义增长率>实际增长率，说明物价上涨'},
  {m:3,q:'化除为乘不可用条件：4%≤|r|≤?且选项接近',a:'5%',opts:['3%','4%','5%','6%'],exp:'化除为乘不可用：4%≤|r|≤5%且选项接近'},
  {m:3,q:'两期比重升降判断：需比较?',a:'a与b带正负号',opts:['a与b的绝对值','a与b带正负号','a-b','b-a'],exp:'比较a和b时要带正负号比较'},
  {m:3,q:'混合增长率反例：两部增长率差?时需估算基期',a:'很大（几十个百分点）',opts:['很小','较大','很大（几十个百分点）','相等'],exp:'r相差很大时，混合增长率可能"叛逃"，需用基期量'}
];

let data={wrongBook:[],todayStats:{learned:0,correct:0,total:0},streak:0};
let currentModule=-1;
let currentIndex=0;
let cardQueue=[];
let answered=false;

function init(){
  const saved=localStorage.getItem(STORAGE_KEY);
  if(saved)data=JSON.parse(saved);
  updateStats();
}

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function updateStats(){
  document.getElementById('stat-learned').textContent=data.todayStats.learned;
  document.getElementById('stat-correct').textContent=data.todayStats.correct;
  document.getElementById('stat-accuracy').textContent=data.todayStats.total>0?Math.round(data.todayStats.correct/data.todayStats.total*100)+'%':'-';
}

function startModule(m){
  currentModule=m;
  cardQueue=CARDS.filter(c=>c.m===m);
  shuffle(cardQueue);
  currentIndex=0;
  showCard();
  document.getElementById('home').style.display='none';
  document.getElementById('learn').style.display='block';
  document.getElementById('module-name').textContent=['百化分速查','核心公式','速算技巧','易错辨析'][m];
}

function showCard(){
  if(currentIndex>=cardQueue.length){
    showResult();
    return;
  }
  const card=cardQueue[currentIndex];
  document.getElementById('card-num').textContent=`${currentIndex+1}/${cardQueue.length}`;
  document.getElementById('question').textContent=card.q;
  document.getElementById('explanation').style.display='none';
  document.getElementById('explanation').textContent=card.exp;
  
  const optsEl=document.getElementById('options');
  optsEl.innerHTML='';
  shuffle(card.opts).forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.textContent=opt;
    btn.onclick=()=>selectAns(opt,card.a,btn);
    optsEl.appendChild(btn);
  });
  answered=false;
}

function selectAns(opt,correct,btnEl){
  if(answered)return;
  answered=true;
  data.todayStats.total++;
  
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(b=>b.style.pointerEvents='none');
  
  if(opt===correct){
    btnEl.classList.add('correct');
    data.todayStats.correct++;
    data.todayStats.learned++;
    save();
    updateStats();
    setTimeout(()=>{currentIndex++;showCard()},800);
  }else{
    btnEl.classList.add('wrong');
    btns.forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});
    document.getElementById('explanation').style.display='block';
    addToWrong(cardQueue[currentIndex]);
    save();
    updateStats();
    setTimeout(()=>{currentIndex++;showCard()},2000);
  }
}

function addToWrong(card){
  const exists=data.wrongBook.find(w=>w.q===card.q);
  if(exists){
    exists.wrongCount++;
    exists.interval=Math.min(exists.interval*2,86400000);
    exists.nextReview=Date.now()+exists.interval;
  }else{
    data.wrongBook.push({q:card.q,interval:300000,nextReview:Date.now()+300000,wrongCount:1});
  }
}

function showResult(){
  const acc=Math.round(data.todayStats.correct/data.todayStats.total*100);
  document.getElementById('learn').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('result-title').textContent=currentIndex>=cardQueue.length?'🎉 完成！':'💪 继续加油';
  document.getElementById('result-stats').textContent=`正确率：${acc}%（${data.todayStats.correct}/${data.todayStats.total}）`;
}

function backHome(){
  document.getElementById('home').style.display='block';
  document.getElementById('learn').style.display='none';
  document.getElementById('result').style.display='none';
  data={wrongBook:data.wrongBook,todayStats:{learned:0,correct:0,total:0},streak:0};
  save();
  updateStats();
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

init();
</script>
<style>
.opt-btn{width:100%;padding:16px;margin:8px 0;background:#fff;border:2px solid #eee;border-radius:12px;font-size:16px;text-align:left;cursor:pointer;transition:all 0.2s}
.opt-btn:active{transform:scale(0.98)}
.opt-btn.correct{background:#e8f5e9;border-color:#4caf50}
.opt-btn.wrong{background:#ffebee;border-color:#f44336}
#learn,#result{display:none;padding:20px;min-height:100vh;background:#f5f5f5}
#card-num{text-align:center;color:#888;font-size:14px;margin-bottom:20px}
#question{font-size:20px;font-weight:600;text-align:center;margin-bottom:24px;line-height:1.6}
#explanation{background:#fff3e0;padding:16px;border-radius:12px;margin-top:16px;font-size:14px;color:#e65100;display:none}
#result{padding-top:40px;text-align:center}
#result h2{font-size:28px;margin-bottom:20px}
#result-stats{font-size:18px;color:#666;margin-bottom:30px}
</style>
<div id="home" class="content">
  <div style="display:flex;justify-content:space-around;margin-top:16px;background:#fff;padding:16px;border-radius:12px">
    <div><div id="stat-learned" style="font-size:24px;font-weight:700;color:#FF6B35">0</div><div style="font-size:12px;color:#888">今日学习</div></div>
    <div><div id="stat-correct" style="font-size:24px;font-weight:700;color:#4caf50">0</div><div style="font-size:12px;color:#888">答对</div></div>
    <div><div id="stat-accuracy" style="font-size:24px;font-weight:700;color:#2196f3">-</div><div style="font-size:12px;color:#888">正确率</div></div>
  </div>
</div>
<div id="learn">
  <div style="background:#fff;border-radius:12px;padding:24px;margin-bottom:16px">
    <div id="module-name" style="text-align:center;font-weight:600;color:#FF6B35;margin-bottom:16px"></div>
    <div id="card-num"></div>
    <div id="question"></div>
    <div id="options"></div>
    <div id="explanation"></div>
  </div>
  <button onclick="backHome()" style="width:100%;padding:14px;background:#fff;border:none;border-radius:12px;font-size:16px;margin-top:16px">返回首页</button>
</div>
<div id="result">
  <h2 id="result-title"></h2>
  <p id="result-stats"></p>
  <button onclick="backHome()" style="padding:14px 40px;background:#FF6B35;color:#fff;border:none;border-radius:12px;font-size:16px">再学一次</button>
</div>
</body>
</html>
